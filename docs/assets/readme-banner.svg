<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Remote Apple TV — знакомый пульт на Android</title>
  <desc id="desc">Тёмная обложка с мятным акцентом и схематичным сенсорным пультом.</desc>
  <defs>
